"#4ACAF0" stroke-width="2.5" stroke-linejoin="round"/><polygon points="600.0,1500 594.96,1488.0 605.04,1488.0" fill="#4ACAF0"/><polyline points="1078,1630.0 1140,1630 1140,415 1078,415.0" fill="none" stroke="#AC83F6" stroke-width="3" stroke-linejoin="round"/><polygon points="1078,415.0 1090.0,409.96 1090.0,420.04" fill="#AC83F6"/><text x="1174" y="1010" style="font-family:'JetBrains Mono','JetBrainsMono Nerd Font','Noto Sans Mono',monospace;font-size:18px;fill:#AC83F6;letter-spacing:1px;" text-anchor="middle" xml:space="preserve" transform="rotate(-90 1174 1010)">WHAT PEOPLE REPORT</text><text x="80" y="1820" style="font-family:'JetBrains Mono','JetBrainsMono Nerd Font','Noto Sans Mono',monospace;font-size:18px;fill:#4ACAF0;" text-anchor="start" xml:space="preserve">●  </text><text x="113" y="1820" style="font-family:'JetBrains Mono','JetBrainsMono Nerd Font','Noto Sans Mono',monospace;font-size:18px;fill:#7C89A4;" text-anchor="start" xml:space="preserve">Agent</text><text x="214" y="1820" style="font-family:'JetBrains Mono','JetBrainsMono Nerd Font','Noto Sans Mono',monospace;font-size:18px;fill:#FDB147;" text-anchor="start" xml:space="preserve">●  </text><text x="247" y="1820" style="font-family:'JetBrains Mono','JetBrainsMono Nerd Font','Noto Sans Mono',monospace;font-size:18px;fill:#7C89A4;" text-anchor="start" xml:space="preserve">Human</text><text x="348" y="1820" style="font-family:'JetBrains Mono','JetBrainsMono Nerd Font','Noto Sans Mono',monospace;font-size:18px;fill:#AC83F6;" text-anchor="start" xml:space="preserve">●  </text><text x="381" y="1820" style="font-family:'JetBrains Mono','JetBrainsMono Nerd Font','Noto Sans Mono',monospace;font-size:18px;fill:#7C89A4;" text-anchor="start" xml:space="preserve">Try again</text><text x="534" y="1820" style="font-family:'JetBrains Mono','JetBrainsMono Nerd Font','Noto Sans Mono',monospace;font-size:18px;fill:#4FC7AD;" text-anchor="start" xml:space="preserve">●  </text><text x="567" y="1820" style="font-family:'JetBrains Mono','JetBrainsMono Nerd Font','Noto Sans Mono',monospace;font-size:18px;fill:#7C89A4;" text-anchor="start" xml:space="preserve">Verified</text><text x="80" y="1874" style="font-family:'JetBrains Mono','JetBrainsMono Nerd Font','Noto Sans Mono',monospace;font-size:20px;fill:#4FC7AD;" text-anchor="start" xml:space="preserve">Check the result</text><text x="304" y="1874" style="font-family:'JetBrains Mono','JetBrainsMono Nerd Font','Noto Sans Mono',monospace;font-size:20px;fill:#7C89A4;" text-anchor="start" xml:space="preserve"> before it ships.</text></svg>